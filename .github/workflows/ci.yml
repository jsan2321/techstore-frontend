name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Dependency vulnerability report
        run: npm audit --omit=dev || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build -t techstore-frontend:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: techstore-frontend:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
      - name: Trigger Render deployment after checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"; else echo "Render deploy hook is not configured."; fi
