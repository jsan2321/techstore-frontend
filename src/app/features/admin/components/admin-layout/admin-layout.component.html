<div class="flex min-h-[calc(100vh-7rem)] gap-0 -mx-6 -mt-8">

  <!-- Sidebar -->
  <aside
    class="sticky top-24 h-[calc(100vh-7rem)] shrink-0 overflow-y-auto border-r border-[color:var(--sand-200)] bg-white/60 backdrop-blur-sm transition-all duration-300"
    [class.w-64]="sidebarOpen()"
    [class.w-16]="!sidebarOpen()"
  >
    <!-- Toggle -->
    <div class="flex items-center justify-between px-4 py-5 border-b border-[color:var(--sand-200)]">
      @if (sidebarOpen()) {
        <span class="text-xs font-bold uppercase tracking-[0.2em] text-[color:var(--accent-600)]">Admin</span>
      }
      <button
        type="button"
        (click)="toggleSidebar()"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-[color:var(--ink-700)] hover:bg-[color:var(--sand-100)] transition-colors"
        [title]="sidebarOpen() ? 'Collapse sidebar' : 'Expand sidebar'"
      >
        <svg class="h-4 w-4 transition-transform duration-200" [class.rotate-180]="!sidebarOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        </svg>
      </button>
    </div>

    <!-- Nav Links -->
    <nav class="flex flex-col gap-1 p-3" aria-label="Admin navigation">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-[color:var(--sand-200)] text-[color:var(--accent-600)] font-bold shadow-sm"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-[color:var(--ink-700)] transition-all hover:bg-[color:var(--sand-100)] hover:text-[color:var(--ink-900)]"
          [title]="item.label"
        >
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          @if (sidebarOpen()) {
            <span class="truncate text-xs uppercase tracking-widest">{{ item.label }}</span>
          }
        </a>
      }
    </nav>
  </aside>

  <!-- Content Area -->
  <main class="flex-1 overflow-y-auto p-6 lg:p-10">
    <router-outlet></router-outlet>
  </main>

</div>
